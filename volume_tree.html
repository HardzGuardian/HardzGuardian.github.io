<script>
function executeScripts(container) {
  const scripts = container.querySelectorAll("script");
  scripts.forEach(oldScript => {
    const newScript = document.createElement("script");
    if (oldScript.src) {
      newScript.src = oldScript.src;
    } else {
      newScript.textContent = oldScript.textContent;
    }
    document.body.appendChild(newScript);
    oldScript.remove();
  });
}
  
async function loadTopbarHTML() {
    const container = document.getElementById("topbar-container");
    const res = await fetch("topbar.html");
    const html = await res.text();
    container.innerHTML = html;
    executeScripts(container);
}
</script>

<script>
function setupSidebarToggles() {
  document.querySelectorAll('.folder-toggle').forEach(btn => {
    const folderName = btn.dataset.folder;
    const memberList = btn.nextElementSibling;
    const savedState = localStorage.getItem(`folder-${folderName}`);

    memberList.style.display = savedState === 'open' ? 'block' : 'none';

    btn.addEventListener('click', () => {
      const isOpen = memberList.style.display === 'block';
      memberList.style.display = isOpen ? 'none' : 'block';
      localStorage.setItem(`folder-${folderName}`, isOpen ? 'closed' : 'open');
    });
  });
}

function setupSidebarSearch() {
  document.getElementById('sidebarSearch').addEventListener('input', function () {
    const filter = this.value.toLowerCase();
    const groups = document.querySelectorAll('.folder-tree > li');

    groups.forEach(group => {
      const folderToggle = group.querySelector('.folder-toggle');
      const memberList = group.querySelector('.member-list');
      const groupName = folderToggle.textContent.toLowerCase();
      const members = group.querySelectorAll('.member-list li');
      let groupMatches = groupName.includes(filter);
      let memberMatches = false;

      members.forEach(member => {
        const name = member.textContent.toLowerCase();
        const visible = filter === '' || name.includes(filter) || groupMatches;
        member.style.display = visible ? '' : 'none';
        if (visible) memberMatches = true;
      });

      group.style.display = groupMatches || memberMatches ? '' : 'none';

      if (filter !== '') {
        memberList.style.display = (groupMatches || memberMatches) ? 'block' : 'none';
      } else {
        const folderName = folderToggle.dataset.folder;
        const saved = localStorage.getItem(`folder-${folderName}`);
        memberList.style.display = saved === 'open' ? 'block' : 'none';
      }
    });
  });
}
document.documentElement.classList.add('loading');
document.body.classList.add('loading');
window.addEventListener('DOMContentLoaded', async () => {
  await loadTopbarHTML();
  setupSidebarToggles();
  setupSidebarSearch();

await Promise.race([
    document.fonts.ready,
    new Promise(resolve => setTimeout(resolve, 4000))
]);

setTimeout(() => {
    const loader = document.getElementById('page-loader');
    loader.classList.add('dismissing');
    
  const cleanup = () => {
      loader.remove();
      setTimeout(() => {
          document.body.classList.remove('loading');
          document.documentElement.classList.remove('loading');
      }, 100);
  };


    loader.addEventListener('transitionend', cleanup, { once: true });
    setTimeout(cleanup, 5000); // fallback in case transitionend doesn't fire
}, 450);


});


</script>

<script>
const LIBRARY_TREE_PATHS = {
  "Movies":        "library/movies.html",
  "TV Shows":      "library/tv-shows.html",
  "Anime":         "library/anime.html",
  "Manga":         "library/manga.html",
  "Novel":         "library/novel.html",
  "Book":          "library/book.html",
  "Tools":         "library/tools.html"
};

loadAllLibraryEntries()
  .then(data => {
    const treeContainer = document.getElementById('library-tree-container');
    document.getElementById('library-volume-root').textContent = `LIBRARY/ (${data.entries.length})`;
    data.categories.forEach(category => {
      const entries = data.entries.filter(e => e.category === category);

      const folderLi = document.createElement('li');
      const label = document.createElement('a');
      label.className = 'folder-label';
      label.href = LIBRARY_TREE_PATHS[category] || '#';
      label.textContent = `${category} (${entries.length})`;
      folderLi.appendChild(label);

      treeContainer.appendChild(folderLi);
    });

    const entries = data.entries;
    document.getElementById('lib-total-entries').textContent = entries.length;

    const rated = entries.filter(e => e.rating !== null && e.rating !== undefined && e.rating !== '');
    document.getElementById('lib-avg-rating').textContent = rated.length
      ? (rated.reduce((sum, e) => sum + Number(e.rating), 0) / rated.length).toFixed(1)
      : '–';

    const barsContainer = document.getElementById('lib-category-bars-container');
    const maxCount = Math.max(...data.categories.map(c => entries.filter(e => e.category === c).length), 1);
    const barMaxLength = 16;

    data.categories.forEach(category => {
      const count = entries.filter(e => e.category === category).length;
      const filled = Math.round((count / maxCount) * barMaxLength);
      const empty = barMaxLength - filled;
      const barStr = `[<span class="bar-fill">${'█'.repeat(filled)}</span>${'·'.repeat(empty)}]`;

      const row = document.createElement('div');
      row.className = 'member-bar';
      row.innerHTML = `
        <span class="label">${category}</span>
        <span class="ascii-bar">${barStr}</span>
        <span class="count">${count}</span>
      `;
      barsContainer.appendChild(row);
    });

    const statuses = {};
    entries.forEach(e => {
      const status = e.status || 'Unknown';
      statuses[status] = (statuses[status] || 0) + 1;
    });

    const statusContainer = document.getElementById('lib-status-container');
    Object.entries(statuses).forEach(([status, count]) => {
      const p = document.createElement('p');
      p.textContent = `${status.toUpperCase()}: ${count}`;
      statusContainer.appendChild(p);
    });

    const topRatedList = document.getElementById('lib-top-rated-list');
    const topRated = rated
      .slice()
      .sort((a, b) => Number(b.rating) - Number(a.rating))
      .slice(0, 10);

    topRated.forEach((entry, i) => {
      const a = document.createElement('a');
      a.className = 'pairing';
      a.href = LIBRARY_TREE_PATHS[entry.category] || '#';

      const rank = document.createElement('span');
      rank.className = 'rank';
      rank.textContent = `#${i + 1}`;

      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = entry.rating;

      a.appendChild(rank);
      a.append(` ${entry.title} `);
      a.appendChild(count);
      topRatedList.appendChild(a);
    });

    const recentList = document.getElementById('changelog-list');
    const recent = [...entries]
      .sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded))
      .slice(0, 8);

    recent.forEach(entry => {
      const li = document.createElement('li');

      const dateSpan = document.createElement('span');
      dateSpan.className = 'date';
      dateSpan.textContent = `${entry.dateAdded} – ${entry.category}`;

      const descLink = document.createElement('a');
      descLink.className = 'desc';
      descLink.href = LIBRARY_TREE_PATHS[entry.category] || '#';
      descLink.textContent = entry.title;

      li.appendChild(dateSpan);
      li.appendChild(descLink);
      recentList.appendChild(li);
    });

  })
  .catch(err => console.error('Error loading library tree:', err));
</script>
